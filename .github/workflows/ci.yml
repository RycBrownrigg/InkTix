name: CI

on:
  push:
    branches: [main, redesign/polkadot-hub]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Pinned nightly, matching contracts/inktix/rust-toolchain.toml — see
          # docs/v2_plan.md Phase 0 for why (upstream Rust regression, no fixed
          # cargo-contract release expected). No explicit `target:` — cargo-contract
          # v6 manages its own PolkaVM target spec internally.
          toolchain: nightly-2026-01-15
          components: rust-src

      - name: Install cargo-contract
        run: cargo install --locked --version 6.0.0-beta.2 cargo-contract

      - name: Run tests (unified contract)
        working-directory: contracts/inktix
        run: cargo test

      - name: Build contract
        working-directory: contracts/inktix
        run: cargo contract build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
